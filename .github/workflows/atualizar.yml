name: Atualizar programação

# Roda de madrugada (05:10 no horário de Brasília = 08:10 UTC) e também sob
# demanda, pelo botão "Run workflow" na aba Actions.
on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela em dias a coletar"
        default: "60"
      descricoes:
        description: "Buscar descrições de todos os eventos (mais lento)"
        type: boolean
        default: true

permissions:
  # O robo nao commita mais nada: escreve o site (pages) e nada no repositorio.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A coleta anterior precisa sobreviver de uma execucao para a outra.
      # Nao e capricho: `coletor.carimbar_estreia` descobre o que e novidade
      # comparando com ela, e o carimbo `visto` viaja dentro do proprio
      # arquivo - o app nao guarda historico. Sem a base de ontem, toda
      # execucao vira "linha de base", ninguem e carimbado, e o trilho de
      # novidades some para sempre, em silencio.
      #
      # Isso funcionava por acidente enquanto `dados/eventos.json` era
      # versionado: o checkout trazia a base junto. Ao tirar o arquivo do
      # historico (para o repositorio parar de crescer 10 MB por dia), o
      # rastreio foi junto sem que nada reclamasse.
      #
      # O cache resolve sem devolver o peso ao git: a chave usa o id da
      # execucao, entao nunca ha acerto exato e o `restore-keys` traz a mais
      # recente; ao fim do job o arquivo novo e salvo sob a chave nova.
      - name: Recuperar a base da coleta anterior
        uses: actions/cache@v4
        with:
          path: dados/eventos.json
          key: eventos-${{ github.run_id }}
          restore-keys: |
            eventos-

      # O modo de falhar deste rastreio e silencioso: sem a base anterior o
      # coletor apenas informa "linha de base" e segue. Um aviso na aba
      # Actions torna visivel a diferenca entre "primeira execucao" e
      # "cache evaporou e o rastreio reiniciou sem ninguem notar".
      # Rede de seguranca: se o cache estiver vazio - primeira execucao depois
      # da mudanca, ou eviccao por desuso - a base de ontem ainda esta
      # publicada no proprio site. Baixa-la evita perder um dia inteiro de
      # rastreio a cada tropeco do cache.
      #
      # O arquivo publicado passou pela retencao e perdeu as descricoes, mas
      # `carimbar_estreia` so le `id`, `visto` e `rastreioDesde` - que sobrevivem
      # inteiros. O preco e pequeno e conhecido: evento cortado pela retencao e
      # que volte depois sera carimbado como novo outra vez.
      - name: Sem cache, buscar a base publicada
        env:
          SITE: "https://acontece-no-sesc.github.io"
        run: |
          if [ -f dados/eventos.json ]; then
            echo "Base anterior veio do cache: $(du -h dados/eventos.json | cut -f1)"
            exit 0
          fi
          mkdir -p dados
          if curl -fsSL --max-time 120 "$SITE/dados/eventos.json" -o dados/eventos.json; then
            echo "Base anterior baixada do site publicado: $(du -h dados/eventos.json | cut -f1)"
          else
            rm -f dados/eventos.json
            echo "::warning::Sem base anterior (cache vazio e site indisponivel). Esta coleta vira linha de base e nao marca novidade; o trilho de novidades reaparece na proxima execucao."
          fi

      - name: Coletar a listagem
        run: python coletor.py --dias "${{ inputs.dias || '60' }}"

      - name: Enriquecer com bilheteria, preços, inscrições e descrições
        run: |
          if [ "${{ inputs.descricoes }}" = "false" ]; then
            python detalhes.py --html-cats "Turismo Social" "Cursos e Oficinas"
          else
            python detalhes.py --html
          fi

      - name: Reprocessar datas e intervalos de viagem
        run: python reparse.py --mostrar 0

      # O coletor já grava as fotos; o que só o extras traz é o endereço das
      # 43 unidades, raspado da página de cada uma. Sem ele o .ics sai sem
      # local nas 9 unidades que não vendem ingresso.
      - name: Endereços das unidades
        run: python extras.py

      - name: Montar o arquivo único e o site
        env:
          # Preencha para usar domínio próprio (ex.: agenda.exemplo.com.br).
          # Vazio = endereço do github.io.
          DOMINIO: ""
        run: |
          python embutir.py --com-descricao
          # O Pages serve na RAIZ quando o repositório se chama
          # <dono>.github.io, e também quando há domínio próprio; nos demais
          # casos serve numa subpasta com o nome do repositório. Passar a
          # subpasta errada quebra todos os caminhos do site de uma vez.
          repo="${GITHUB_REPOSITORY#*/}"
          dono="${GITHUB_REPOSITORY_OWNER}"
          if [ -n "$DOMINIO" ] || [ "${repo,,}" = "${dono,,}.github.io" ]; then
            base="/"
          else
            base="/$repo/"
          fi
          python publicar.py --base "$base"
          # O Pages só assume o domínio próprio se este arquivo estiver na
          # saída publicada — e o web/ é refeito do zero a cada rodada.
          if [ -n "$DOMINIO" ]; then echo "$DOMINIO" > web/CNAME; fi

      # Publicar vem ANTES de guardar no git. O site sai do artefato abaixo;
      # o commit é só contabilidade, e não pode derrubar uma hora de coleta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # Os dados NAO sao mais versionados. Cada coleta acrescentava ~10,6 MB
      # de conteudo novo (eventos.json 5,4 MB + prototipo.html 5,2 MB), pouco
      # compressivel entre versoes: em 8 rodadas o .git ja estava em 49 MB, e
      # a projecao de um ano de execucao diaria era da ordem de 1 a 2 GB - o
      # GitHub avisa a partir de 1 GB.
      #
      # O commit sempre foi so contabilidade: o site sai do artefato do passo
      # acima, nunca do repositorio. Quem quiser a base de um dia especifico
      # baixa o artefato da execucao correspondente.
      - name: Guardar a base como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: base-${{ github.run_number }}
          path: |
            dados/eventos.json
          retention-days: 30
          compression-level: 9

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
